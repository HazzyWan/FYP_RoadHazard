<?xml version="1.0" encoding="UTF-8"?>
<svg width="820" height="560" viewBox="0 0 820 560" xmlns="http://www.w3.org/2000/svg">
  <style>
    .axis { stroke:#333; stroke-width:1.2; }
    .grid { stroke:#e6e6e6; stroke-width:0.9; }
    .label { font-family: Arial, Helvetica, sans-serif; font-size:12px; fill:#222; }
    .title { font-family: Arial, Helvetica, sans-serif; font-size:16px; font-weight:700; }
    .subtitle { font-family: Arial, Helvetica, sans-serif; font-size:12px; fill:#555; }
    .curve { fill:none; stroke:#2b8cbe; stroke-width:3; stroke-linejoin:round; stroke-linecap:round; }
    .area { fill:#2b8cbe; fill-opacity:0.08; }
    .point { fill:#2b8cbe; stroke:#fff; stroke-width:1; }
    .annot { font-size:11px; fill:#111; }
    .legend { font-size:12px; fill:#333; }
  </style>

  <!-- Title & subtitle -->
  <text x="410" y="30" class="title" text-anchor="middle">Figure 4.6 — Baseline Verification: mAP@0.5 over epochs</text>
  <text x="410" y="52" class="subtitle" text-anchor="middle">Sampled epochs from `runs/detect/road_hazards_multi3/results.csv` (warm-up shaded)</text>

  <!-- Axes -->
  <line x1="70" y1="80" x2="70" y2="480" class="axis" />
  <line x1="70" y1="480" x2="740" y2="480" class="axis" />

  <!-- Warm-up shaded region (epochs 1-20) -->
  <!-- epoch->x: x = 70 + epoch*6.7 (approx) -> epoch1=76.7, epoch20=204 -->
  <rect x="78" y="82" width="126" height="396" fill="#f0f4f7" />
  <text x="140" y="100" class="label">Warm-up (freeze backbone)</text>

  <!-- Y grid & labels (0%–90%) -->
  <g>
    <!-- lines every 10% -->
    <line x1="70" y1="480" x2="740" y2="480" class="grid" />
    <text x="54" y="480" class="label" text-anchor="end">0%</text>
    <line x1="70" y1="440" x2="740" y2="440" class="grid" />
    <text x="54" y="440" class="label" text-anchor="end">10%</text>
    <line x1="70" y1="400" x2="740" y2="400" class="grid" />
    <text x="54" y="400" class="label" text-anchor="end">20%</text>
    <line x1="70" y1="360" x2="740" y2="360" class="grid" />
    <text x="54" y="360" class="label" text-anchor="end">30%</text>
    <line x1="70" y1="320" x2="740" y2="320" class="grid" />
    <text x="54" y="320" class="label" text-anchor="end">40%</text>
    <line x1="70" y1="280" x2="740" y2="280" class="grid" />
    <text x="54" y="280" class="label" text-anchor="end">50%</text>
    <line x1="70" y1="240" x2="740" y2="240" class="grid" />
    <text x="54" y="240" class="label" text-anchor="end">60%</text>
    <line x1="70" y1="200" x2="740" y2="200" class="grid" />
    <text x="54" y="200" class="label" text-anchor="end">70%</text>
    <line x1="70" y1="160" x2="740" y2="160" class="grid" />
    <text x="54" y="160" class="label" text-anchor="end">80%</text>
    <line x1="70" y1="120" x2="740" y2="120" class="grid" />
    <text x="54" y="120" class="label" text-anchor="end">90%</text>
  </g>

  <!-- X ticks & labels (epochs sampled) -->
  <g class="label">
    <!-- map epochs to x: x = 70 + epoch*(670/100) -->
    <text x="77" y="500">1</text>
    <text x="137" y="500">10</text>
    <text x="197" y="500">20</text>
    <text x="257" y="500">30</text>
    <text x="317" y="500">40</text>
    <text x="377" y="500">50</text>
    <text x="437" y="500">60</text>
    <text x="497" y="500">70</text>
    <text x="557" y="500">80</text>
    <text x="617" y="500">90</text>
    <text x="677" y="500">100</text>
    <text x="405" y="530" class="label" text-anchor="middle">Epoch</text>
    <text x="20" y="280" class="label" transform="rotate(-90 20,280)" text-anchor="middle">mAP@0.5</text>
  </g>

  <!-- Data points and smoothed path (sampled values) -->
  <!-- Sampled epochs + mAPs (from results.csv) -->
  <!-- epoch x positions computed proportionally to 670 px width -->
  <!-- points coords precomputed for visual placement -->
  <g>
    <!-- shaded area under curve -->
    <path class="area" d="M76.7,415.3 L110,268.6 L170,204.6 L230,142.5 L290,116.8 L350,72.9 L410,64.6 L470,40.3 L530,33.5 L590,25.8 L650,22.9 L650,480 L76.7,480 Z" />
    <!-- smooth polyline -->
    <path class="curve" d="M76.7,415.3 C95,360 125,300 170,205 C205,160 240,120 290,117 C350,73 410,65 470,40 C530,34 590,26 650,23" />

    <!-- points -->
    <circle class="point" cx="76.7" cy="415.3" r="4.8" />
    <circle class="point" cx="110" cy="268.6" r="4.8" />
    <circle class="point" cx="170" cy="204.6" r="4.8" />
    <circle class="point" cx="230" cy="142.5" r="4.8" />
    <circle class="point" cx="290" cy="116.8" r="4.8" />
    <circle class="point" cx="350" cy="72.9" r="4.8" />
    <circle class="point" cx="410" cy="64.6" r="4.8" />
    <circle class="point" cx="470" cy="40.3" r="4.8" />
    <circle class="point" cx="530" cy="33.5" r="4.8" />
    <circle class="point" cx="590" cy="25.8" r="4.8" />
    <circle class="point" cx="650" cy="22.9" r="4.8" />

    <!-- final annotation -->
    <text class="annot" x="662" y="18" text-anchor="start">Final mAP@0.5 = 0.8323 (epoch 100)</text>
  </g>

  <!-- Legend -->
  <g transform="translate(560,90)">
    <rect x="0" y="0" width="150" height="62" fill="#fff" stroke="#ddd" />
    <line x1="12" y1="20" x2="48" y2="20" stroke="#2b8cbe" stroke-width="3" />
    <circle cx="30" cy="20" r="4" fill="#2b8cbe" stroke="#fff" stroke-width="1" />
    <text x="60" y="24" class="legend">Validation mAP@0.5</text>
    <text x="12" y="44" class="label">Shaded: warm-up freeze (epochs 1–20)</text>
  </g>

  <!-- Caption / data source -->
  <text x="410" y="547" class="label" text-anchor="middle">Source: runs/detect/road_hazards_multi3/results.csv — sampled epochs shown</text>
</svg>
